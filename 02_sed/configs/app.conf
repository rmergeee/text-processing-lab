# ==========================================
# Application Configuration File
# Environment: Staging
# ==========================================

[general]
app_name = MyApp
# debug = true
debug = false
log_level = INFO
timezone = Europe/Kyiv

[server]
host = 127.0.0.1
# port = 8080
port = 3000
timeout = 60
keepalive = 300
workers = 2

[database]
db_host = localhost
db_port = 5432
db_name = old_database_name
db_user = app_admin
db_password = OLD_SECRET_KEY
# pool_size = 5
pool_size = 10
ssl_mode = disable

[redis]
redis_host = 127.0.0.1
redis_port = 6379
# redis_password = none
